name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to release (e.g., v1.2.3)'
        required: true
        type: string

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write           # Sigstore certificate for the attestations
      attestations: write       # store the attestations on the repository
      artifact-metadata: write  # artifact storage record created by actions/attest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate tag format
        run: |
          TAG="${GITHUB_EVENT_INPUTS_TAG}"
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid tag format. Expected format: v1.2.3"
            exit 1
          fi
          echo "✅ Tag format is valid: $TAG"
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      # The provenance attestation records the ref and commit the workflow was
      # dispatched on. Dispatched from main, it would state that the release was
      # built from main's head, not from the tag.
      - name: Require dispatch from the tag being released
        run: |
          if [[ "${GITHUB_REF}" != "refs/tags/${GITHUB_EVENT_INPUTS_TAG}" ]]; then
            echo "❌ Run this workflow with 'Use workflow from' set to tag ${GITHUB_EVENT_INPUTS_TAG} (current ref: ${GITHUB_REF})"
            echo "   gh workflow run release.yml --ref ${GITHUB_EVENT_INPUTS_TAG} -f tag=${GITHUB_EVENT_INPUTS_TAG}"
            exit 1
          fi
          echo "✅ Dispatched from ${GITHUB_REF}"
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Verify tag exists
        run: |
          TAG="${GITHUB_EVENT_INPUTS_TAG}"
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "❌ Tag '$TAG' does not exist in the repository"
            echo "Available tags:"
            git tag --sort=-version:refname | head -10
            exit 1
          fi
          echo "✅ Tag '$TAG' exists"
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Checkout specific tag
        run: |
          git checkout ${GITHUB_EVENT_INPUTS_TAG}
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Verify GPG signature on tag
        run: |
          TAG="${GITHUB_EVENT_INPUTS_TAG}"
          
          # Force fetch the complete tag object (not just commit reference)
          echo "=== Fetching Tag Object ==="
          git fetch origin tag $TAG --force
          
          # Debug: Show what type of object we have
          echo "=== Tag Object Debug ==="
          git cat-file -t $TAG
          echo "Tag points to commit: $(git rev-parse $TAG^{})"
          echo "Tag object hash: $(git rev-parse $TAG)"
          echo "=== End Tag Debug ==="
          
          # Import public key for verification
          echo "=== Importing GPG Key ==="
          echo '${{ secrets.GPG_PUBLIC_KEY }}' > /tmp/pubkey.asc
          head -3 /tmp/pubkey.asc
          gpg --import /tmp/pubkey.asc
          echo "=== GPG Key Imported ==="
          
          # Verify the tag is properly signed
          echo "=== Verifying Tag Signature ==="
          git tag -v $TAG
          
          echo "✅ Tag signature verified"
          
          # Cleanup
          rm /tmp/pubkey.asc
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Get version from tag
        id: get_version
        run: |
          TAG="${GITHUB_EVENT_INPUTS_TAG}"
          VERSION=${TAG#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Package repository
        run: |
          mkdir -p dist
          
          # Create source package
          zip -r dist/fractum-${STEPS_GET_VERSION_OUTPUTS_VERSION}-source.zip \
            src/ \
            packages/ \
            tests/ \
            bootstrap-*.sh \
            bootstrap-*.ps1 \
            Dockerfile \
            .dockerignore \
            assets \
            setup.py \
            README.md \
            LICENSE \
            fractum-signing-key.asc \
            TRADEMARK.md \
            SECURITY.md \
            --exclude="*.pyc" \
            --exclude="__pycache__/*" \
            --exclude="*.DS_Store" \
            --exclude=".git/*"
        env:
          STEPS_GET_VERSION_OUTPUTS_VERSION: ${{ steps.get_version.outputs.version }}

      # The zip ships its dependencies as wheel files in packages/. SBOM scanners
      # such as syft catalog installed packages and report nothing for loose
      # wheels, so the SBOM is built from the wheels themselves, with the SHA-256
      # of each file. The script is inline because the job runs on the checked-out
      # tag, where a script file added after that tag would not exist.
      - name: Generate SBOM (CycloneDX)
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, uuid

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          zip_path = pathlib.Path(f"dist/fractum-{version}-source.zip")

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          zip_digest = sha256(zip_path)
          # Tag commit date, so that rebuilding the same tag gives the same SBOM.
          timestamp = subprocess.run(
              ["git", "log", "-1", "--format=%cI", tag],
              check=True, capture_output=True, text=True,
          ).stdout.strip()

          components = []
          for wheel in sorted(pathlib.Path("packages").glob("*.whl")):
              # PEP 427: {name}-{version}(-{build})?-{python}-{abi}-{platform}.whl
              name, wheel_version = wheel.name.split("-")[:2]
              name = re.sub(r"[-_.]+", "-", name).lower()
              components.append({
                  "type": "library",
                  "bom-ref": f"wheel:{wheel.name}",
                  "name": name,
                  "version": wheel_version,
                  "purl": f"pkg:pypi/{name}@{wheel_version}?file_name={wheel.name}",
                  "hashes": [{"alg": "SHA-256", "content": sha256(wheel)}],
              })

          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "serialNumber": f"urn:uuid:{uuid.uuid5(uuid.NAMESPACE_URL, 'sha256:' + zip_digest)}",
              "version": 1,
              "metadata": {
                  "timestamp": timestamp,
                  "component": {
                      "type": "application",
                      "bom-ref": "fractum",
                      "name": "fractum",
                      "version": version,
                      "purl": f"pkg:github/katvio/fractum@{tag}",
                      "hashes": [{"alg": "SHA-256", "content": zip_digest}],
                      "externalReferences": [
                          {"type": "vcs", "url": "https://github.com/katvio/fractum"},
                      ],
                  },
              },
              "components": components,
              "dependencies": [
                  {"ref": "fractum", "dependsOn": [c["bom-ref"] for c in components]},
              ],
          }
          out = pathlib.Path(f"dist/fractum-{version}-sbom.cdx.json")
          out.write_text(json.dumps(bom, indent=2) + "\n")
          print(f"SBOM: {out} ({len(components)} wheels)")
          PY
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          TAG: ${{ steps.get_version.outputs.tag }}

      - name: Create checksums
        run: |
          cd dist
          sha256sum "fractum-${VERSION}-source.zip" "fractum-${VERSION}-sbom.cdx.json" > checksums.txt
        env:
          VERSION: ${{ steps.get_version.outputs.version }}

      # SLSA build provenance: binds the zip and the SBOM to this workflow run,
      # the tag's commit and the repository, signed through Sigstore.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            dist/fractum-${{ steps.get_version.outputs.version }}-source.zip
            dist/fractum-${{ steps.get_version.outputs.version }}-sbom.cdx.json

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: dist/fractum-${{ steps.get_version.outputs.version }}-source.zip
          sbom-path: dist/fractum-${{ steps.get_version.outputs.version }}-sbom.cdx.json

      - name: Extract release notes from tag
        id: release_notes
        run: |
          TAG="${GITHUB_EVENT_INPUTS_TAG}"
          # Extract release notes from signed tag message
          NOTES=$(git tag -l --format='%(contents)' $TAG)
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          GITHUB_EVENT_INPUTS_TAG: ${{ github.event.inputs.tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631  # v2.2.2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Fractum ${{ steps.get_version.outputs.tag }}
          body: |
            ## 🔐 Security Verification
            
            **GPG Signature:** ✅ This release is cryptographically signed
            **Key ID:** D009F6290DCFDAB6
            **Signed by:** S.A.S.U. KATVIO (Fractum Release Signing)
            
            ### Verify Release Authenticity
            ```bash
            # Import KATVIO public key
            curl -O https://fractum.katvio.com/fractum-signing-key.asc
            gpg --import fractum-signing-key.asc
            
            # Verify tag signature
            git tag -v ${{ steps.get_version.outputs.tag }}
            
            # Verify package checksum
            sha256sum -c checksums.txt
            ```

            ### Verify Build Provenance and SBOM
            The source ZIP carries a SLSA build provenance attestation and a CycloneDX SBOM attestation, both signed through Sigstore by this release workflow. Requires GitHub CLI 2.49 or later.
            ```bash
            # Provenance: built by katvio/fractum's release workflow from this tag
            gh attestation verify fractum-${{ steps.get_version.outputs.version }}-source.zip \
              --repo katvio/fractum \
              --signer-workflow katvio/fractum/.github/workflows/release.yml \
              --source-ref refs/tags/${{ steps.get_version.outputs.tag }}

            # SBOM: the wheels shipped in packages/, with their SHA-256
            gh attestation verify fractum-${{ steps.get_version.outputs.version }}-source.zip \
              --repo katvio/fractum \
              --predicate-type https://cyclonedx.org/bom
            ```

            ## 📋 Release Notes
            ${{ steps.release_notes.outputs.notes }}
            
            ## 📦 Download Options
            - **Source Code:** Use git clone or download ZIP
            - **Verification:** Always verify GPG signatures before use
            
          files: |
            dist/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update website release info
        run: |
          echo "🚀 Released Fractum ${STEPS_GET_VERSION_OUTPUTS_VERSION}"
          echo "Tag: ${STEPS_GET_VERSION_OUTPUTS_TAG}"
          echo "Signature verified: ✅"
        env:
          STEPS_GET_VERSION_OUTPUTS_VERSION: ${{ steps.get_version.outputs.version }}
          STEPS_GET_VERSION_OUTPUTS_TAG: ${{ steps.get_version.outputs.tag }}
